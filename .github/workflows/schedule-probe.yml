# Diagnostic (temporary): does GitHub create scheduled runs in this repository at all?
# Minimal on purpose: no checkout, no commits, no concurrency group, no permissions.
name: schedule-probe
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "probe ran at $(date -u +%FT%TZ) for event ${{ github.event_name }}"
